services:
  conta-corrente-api:
    build: ./BankMore.ContaCorrente
    ports: ["5001:8080"]

  transferencia-api:
    build: ./BankMore.Transferencia
    ports: ["5002:8080"]
    environment:
      - ContaCorrenteApi__BaseUrl=http://conta-corrente-api:8080

  # opcional
  kafka:
    image: confluentinc/cp-kafka